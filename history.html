<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Practice History</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            🇯🇵 Japanese Practice
        </div>

        <!-- Opens the practice page in another tab -->
        <a href="index.html"
           class="history-link"
           target="_blank"
           rel="noopener noreferrer">
            🎤 Practice
        </a>
    </header>

    <main class="container history-container">

        <section class="hero-section">
            <p class="small-label">YOUR SAVED ANSWERS</p>

            <h1>Practice History</h1>

            <p class="intro-text">
                Review the Japanese questions and answers you saved.
            </p>
        </section>

        <section class="history-card">

            <div class="history-top">
                <h2>Saved Answers</h2>

                <button id="clearHistoryBtn" class="delete-btn">
                    🗑 Clear History
                </button>
            </div>

            <div id="historyList" class="history-list">
                <!-- Saved answers will appear here -->
            </div>

        </section>

    </main>

    <footer class="footer">
        <p>Japanese Speaking Practice © 2026</p>
    </footer>

    <script>
        const historyList = document.getElementById("historyList");
        const clearHistoryBtn = document.getElementById("clearHistoryBtn");

        function displayHistory() {
            const savedAnswers =
                JSON.parse(localStorage.getItem("japaneseAnswers")) || [];

            historyList.innerHTML = "";

            if (savedAnswers.length === 0) {
                historyList.innerHTML = `
                    <div class="empty-history">
                        <div class="empty-icon">📭</div>
                        <h3>No saved answers yet</h3>
                        <p>
                            Go to the practice page and save your Japanese answers.
                        </p>
                    </div>
                `;

                return;
            }

            savedAnswers.forEach((item, index) => {
                const historyItem = document.createElement("article");

                historyItem.className = "history-item";

                historyItem.innerHTML = `
                    <div class="history-item-header">
                        <span>Answer ${index + 1}</span>
                        <span>${item.date || ""}</span>
                    </div>

                    <div class="history-question">
                        <h3>${item.questionJapanese}</h3>
                        <p>${item.questionKana}</p>
                        <p class="romaji">${item.questionRomaji}</p>
                        <p class="meaning">${item.questionMeaning}</p>
                    </div>

                    <div class="saved-answer">
                        <strong>Your Answer:</strong>
                        <p>${item.answer || "No answer text saved."}</p>
                    </div>
                `;

                historyList.appendChild(historyItem);
            });
        }

        clearHistoryBtn.addEventListener("click", function () {
            const confirmation = confirm(
                "Are you sure you want to delete all saved answers?"
            );

            if (confirmation) {
                localStorage.removeItem("japaneseAnswers");
                displayHistory();
            }
        });

        displayHistory();
    </script>

</body>
</html>
